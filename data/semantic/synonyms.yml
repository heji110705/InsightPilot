version: 1
# 业务同义词表。左侧是"用户可能说出口的词"，右侧是语义层里的写法。
# 检索器只做一件事：问题里出现 key，就把 values 里的词并进 BM25 查询。
# 所以每组都要保证 key 是真实口语、values 里至少有一个能命中表卡片或指标别名。
synonyms:
  分类: [类型, 题材, 品类, 门类, 类别, 哪类]
  出版社: [出版方, 出版机构, 出版公司, 哪个社, 哪家出版社]
  评分: [打分, 分数, 星级, 评价分, 口碑分, 几分]
  评论: [书评, 短评, 评价, 留言, 讨论, 评论数]
  收藏: [书架, 加入书架, 收藏夹, 收了, 收藏数]
  点击: [点开, 点进去, 点击量, 被点, 点击次数]
  热度: [曝光, 流量, 人气, 关注度, 热门]
  作者: [作家, 写书的人, 著者, 谁写的]
  用户: [读者, 会员, 访客, 用户数, 多少人]
  书: [图书, 书目, 书籍, 作品, 多少本]
  价格: [定价, 书价, 售价, 多少钱, 贵, 便宜]
  出版年份: [出版年, 哪年出版, 出书年份, 年份]
  好评: [高分, 正面评价, 满意, 好评率]
  差评: [低分, 负面评价, 不满意, 吐槽]
  情感: [情绪, 正负面, 情感倾向, 情感分]
  豆瓣: [豆瓣评分, 豆瓣分, 外部评分, 豆瓣口碑]
  读完: [已读, 看完, read, 读完率]
  想读: [想看, 心愿单, want, 待读]
  在读: [正在读, reading, 阅读中]
  冷门: [小众, 没人看, 被埋没, 遗珠, 低曝光]
  页数: [厚度, 多少页, 篇幅, 多厚]
  装帧: [平装, 精装, 版本, 装订]
  打分人数: [评分人数, 多少人打分, 评价人数, 评分数]
  占比: [比例, 百分比, 份额, 结构占比]
  平均: [均值, 平均水平, 人均, 书均]
  排名: [排行, 榜单, 前十, 最多, 最高]
  转化率: [转化, 漏斗, 点击率, 转化比例]
  时间: [日期, 哪天, 什么时候, 按天]
  作者数: [多少位作者, 作者人数, 作家数量]
  书籍数: [多少本书, 图书数量, 藏书量, 书目数]

joins:
  - dim_book.book_id = fact_rating.book_id
  - dim_book.book_id = fact_comment.book_id
  - dim_book.book_id = fact_click.book_id
  - dim_book.book_id = fact_shelf.book_id
  - dim_book.author_id = dim_author.author_id
  - fact_rating.rated_on = dim_date.date_key
  - fact_comment.created_on = dim_date.date_key
  - fact_click.clicked_on = dim_date.date_key
  - fact_shelf.created_on = dim_date.date_key
  - v_book_overview.book_id = dim_book.book_id
