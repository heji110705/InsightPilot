# 输出约定（output defaults）
#
# 为什么需要这一层
# ----------------
# 最早的提示词只写了「必须带 LIMIT」「比率注意分母」，但没给具体数值。结果是
# 同类问题每次的行数、小数位都不一样：问「哪些书」给 20 行，问「哪本书」给 5 行，
# 比率一会儿 1 位一会儿 2 位。这类差异和「模型懂不懂业务」无关，纯粹是约定没定死。
#
# 把它们从提示词搬到配置文件，好处有三：
#   1. 模型每次读到的数值一致，不需要"猜"；
#   2. 人改口径只改这一处，不用全文搜提示词；
#   3. 约定本身可被测试断言（tests/test_sem_defaults.py）。
#
# 注意：用户明确说了数量（"前十""三个""八年"）时，一律以用户为准，本文件只是兜底。

version: 1

limits:
  # 排名 / 分组 / 榜单类问题的默认返回行数。
  ranking: 10
  # 「哪一个 / 哪一本 / 谁」这类单数问题只返回 1 行——用户问一本书，就给一本。
  single: 1
  # 明细类（逐行列出、不聚合）的行数上限，防止把整表倒出来。
  detail: 50

format:
  # 比率、占比、均值这类连续量统一保留 2 位小数。
  decimal_places: 2
  # 百分比用 0-100 的数值表示，不带 % 号，方便前端画图和导出。
  percent_scale: 100.0
  # 计数、人数、页数这类自然整数不保留小数。
  integer_places: 0

stats:
  # 分组统计的最小样本量：低于该值的组不参与排名。
  # 不设这个下限，只有 1 本书的出版社会因为"平均点击 37 次"排到第一。
  min_group_size: 5
